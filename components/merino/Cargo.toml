[package]
name = "merino"
version = "0.1.0"
edition = "2021"
exclude = ["/android"]

[dependencies]
uniffi = { git = "https://github.com/mozilla/uniffi-rs", rev = "c0d94427803d40bbd7800df57f5f524ff4d16c3b" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
viaduct = { path = "../viaduct", features = ["ohttp"] }
error-support = { path = "../support/error" }
thiserror = "2"

[build-dependencies]
uniffi = { git = "https://github.com/mozilla/uniffi-rs", rev = "c0d94427803d40bbd7800df57f5f524ff4d16c3b", features = ["build"] }

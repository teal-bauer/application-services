[package]
name = "merino"
version = "0.1.0"
edition = "2021"
exclude = ["/android"]

[dependencies]
uniffi = { git = "https://github.com/mozilla/uniffi-rs", rev = "d75c5a21ae64621216240b4a7105b2ca204b19bb" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
viaduct = { path = "../viaduct", features = ["ohttp"] }
error-support = { path = "../support/error" }
thiserror = "2"

[build-dependencies]
uniffi = { git = "https://github.com/mozilla/uniffi-rs", rev = "d75c5a21ae64621216240b4a7105b2ca204b19bb", features = ["build"] }
